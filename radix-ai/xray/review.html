<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2ba67a"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>X-ray doctor review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/colors.css"><link rel="stylesheet" href="../css/xray.css">
</head><body>
<header><div class="wrap bar"><a class="logo" href="../">RADIX <span>AI</span> X-ray review</a><span><span id="who" class="muted"></span> <button id="out" class="btn ghost" type="button" hidden>Log out</button> <a class="link" href="index.html">Patient page</a></span></div></header>
<div id="demo" class="demo" hidden><b>DEMO MODE.</b> Sample data stored only in this browser. Any email and password will log in.</div>
<main class="wrap">
  <form id="login" class="card narrow">
    <h2>Doctor login</h2>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password">
    <button class="btn full" type="submit">Log in</button><p id="aerr" class="err" role="alert"></p>
  </form>
  <section id="list" hidden>
    <nav class="tabs" id="qtabs"></nav>
    <div class="card" id="queue"></div>
  </section>
  <section id="detail" hidden></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/xray/common.js"></script>
<script src="../js/xray/review.js"></script>
</body></html>
